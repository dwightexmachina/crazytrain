name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Turns on GitHub Pages (source = Actions) on the first run so the
      # initial deploy doesn't need Pages flipped on manually first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
      - run: flutter pub get
      # base-href must match the repo name so a project page (…/<repo>/) loads.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
